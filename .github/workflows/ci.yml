name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (also generates the Prisma client)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Production build (no secrets required)
        run: npm run build

  integration:
    name: Database, auth and e2e (local Supabase)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ephemeral local stack inside the runner; no hosted project or secrets.
      - name: Start local Supabase
        run: npm run db:local:start

      - name: Apply migrations
        run: npm run db:local:setup

      - name: Check migrations match the Prisma schema
        run: npm run db:local:drift

      - name: Integration tests (real Postgres + Supabase Auth)
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npm run db:local:stop

  deploy:
    name: Migrate database, then deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [verify, integration]
    environment: production
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations
        shell: bash
        run: |
          : "${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is not set}"
          npm run db:migrate:deploy
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      - name: Deploy this commit to Vercel
        shell: bash
        run: |
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is not set}" "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is not set}"
          jq -n \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg org "$GITHUB_REPOSITORY_OWNER" \
            --arg repo "${GITHUB_REPOSITORY#*/}" \
            --arg sha "$GITHUB_SHA" \
            '{name: $repo, project: $project, target: "production", gitSource: {type: "github", org: $org, repo: $repo, ref: "main", sha: $sha}}' |
          curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST "https://api.vercel.com/v13/deployments?forceNew=1${VERCEL_ORG_ID:+&teamId=$VERCEL_ORG_ID}" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data @-
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
